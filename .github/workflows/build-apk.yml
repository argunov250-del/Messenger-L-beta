name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create blank Expo project (latest SDK)
        run: npx --yes create-expo-app@latest app --template blank --no-install

      - name: Add App.js, icon, name and package
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cp src/App.js app/App.js
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          mkdir -p app/assets
          curl -fsSL -o app/assets/icon.png "https://drive.usercontent.google.com/download?id=1ASSc14s70BP5yG43vDke6gqPOQhHQRDz&export=download"
          curl -fsSL -o app/assets/adaptive-icon.png "https://drive.usercontent.google.com/download?id=1Rk_Qdi026sxqvt7ElPTmmhyXHEcklrFt&export=download"
          cd app
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            c.expo.name = 'Мессенджер';
            c.expo.icon = './assets/icon.png';
            c.expo.android = {
              ...(c.expo.android || {}),
              package: 'com.messenger.duo',
              adaptiveIcon: {
                foregroundImage: './assets/adaptive-icon.png',
                backgroundColor: '#B4C6DC'
              }
            };
            c.expo.userInterfaceStyle = 'automatic';
            c.expo.plugins = [...(c.expo.plugins || []), 'expo-notifications', 'expo-video'];
            const pid = process.env.EXPO_PROJECT_ID;
            if (pid) c.expo.extra = { ...(c.expo.extra || {}), eas: { projectId: pid } };
            if (fs.existsSync('google-services.json')) c.expo.android.googleServicesFile = './google-services.json';
            fs.writeFileSync('app.json', JSON.stringify(c, null, 2));
          "

      - name: Install dependencies
        working-directory: app
        run: |
          npm install
          npx expo install @react-native-async-storage/async-storage expo-image-picker expo-image-manipulator expo-file-system expo-video expo-notifications expo-constants react-native-safe-area-context

      - name: Prebuild Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-v5-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
